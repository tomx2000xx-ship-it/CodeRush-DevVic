name: CodeRush Flashscore Live Feed

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/flashscore-live.yml"
      - "scripts/flashscore_live_pump.py"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# v2 avoids the abandoned pending run in the previous concurrency group.
concurrency:
  group: coderush-flashscore-live-v2
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out CodeRush
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the feed runner
        run: python -m py_compile scripts/flashscore_live_pump.py

      - name: Run the Flashscore live feed
        env:
          CODERUSH_WORKER_URL: https://coderush-devvic.tomx2000xx.workers.dev
        run: python scripts/flashscore_live_pump.py
